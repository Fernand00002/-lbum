<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="corazones-bg" class="corazones-container" aria-hidden="true"></div>
    <div id="notificacion" class="notificacion oculto"></div>

    <!-- Reproductor de música flotante -->
    <div class="musica-flotante">
        <audio id="audio-fondo" loop>
            <!-- REEMPLAZA ESTE ENLACE CON EL ENLACE DIRECTO DE TU MP3 EN SUPABASE STORAGE -->
            <source src="https://mhhdsvthqwwwwzfumlxc.supabase.co/storage/v1/object/public/fotos/Alvaro%20Diaz%20-%20INAROW62.%20(Visualizer)%20-%20YoAlvaroDiazVEVO.mp3" type="audio/mpeg">
        </audio>
        <button type="button" id="btn-musica" class="btn-musica" aria-label="Reproducir música">
            <svg id="icono-musica" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span id="texto-musica">Música</span>
        </button>
    </div>

    <header class="hero">
        <div class="hero-content">
            <h1>Nuestra Historia</h1>
            <p class="subtitulo">Cada día contigo es mi favorito</p>
            <div class="contador-card">
                <span class="contador-etiqueta">Llevamos juntos</span>
                <p id="contador-dias">Calculando...</p>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="card upload-section">
            <h3>Guardar un nuevo recuerdo</h3>
            <form id="upload-form">
                <div class="form-group">
                    <label for="titulo">Descripción del momento</label>
                    <input type="text" id="titulo" placeholder="Ej. Cena de aniversario, paseo en la tarde..." required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha del recuerdo</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="archivo">Fotos o videos (puedes elegir varios)</label>
                    <input type="file" id="archivo" accept="image/*,video/*" multiple required>
                    <span id="contador-archivos" class="texto-ayuda">Ningún archivo seleccionado</span>
                </div>

                <button type="submit" id="btn-subir">Guardar en nuestro álbum</button>
            </form>
        </section>

        <section class="card gallery-section">
            <h3>Nuestros Momentos</h3>
            <div id="galeria" class="grid-galeria"></div>
        </section>
    </main>

    <!-- Ventana Modal para Editar Recuerdo -->
    <div id="modal-editar" class="modal-overlay oculto">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Editar recuerdo</h3>
                <button type="button" id="btn-cerrar-modal" class="btn-cerrar" aria-label="Cerrar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form id="edit-form">
                <input type="hidden" id="edit-id">

                <div class="form-group">
                    <label for="edit-titulo">Descripción del momento</label>
                    <input type="text" id="edit-titulo" required>
                </div>

                <div class="form-group">
                    <label for="edit-fecha">Fecha del recuerdo</label>
                    <input type="date" id="edit-fecha" required>
                </div>

                <div class="form-group">
                    <label>Archivos actuales (toca la X para quitar)</label>
                    <div id="edit-lista-actuales" class="edit-grid-archivos"></div>
                </div>

                <div class="form-group">
                    <label for="edit-nuevos-archivos">Agregar más fotos o videos (opcional)</label>
                    <input type="file" id="edit-nuevos-archivos" accept="image/*,video/*" multiple>
                    <span id="edit-contador-nuevos" class="texto-ayuda">Ningún archivo adicional seleccionado</span>
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btn-cancelar-edit" class="btn-secundario">Cancelar</button>
                    <button type="submit" id="btn-guardar-edit" class="btn-primario">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
